<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards (M0 prototype)</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --card:#fff; --muted:#667; --ok:#1a7f4b; --bad:#b3261e; --acc:#2456d6; --on-acc:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171b; --fg:#e8eaed; --card:#1e2329; --muted:#9aa3ad; --ok:#4cc38a; --bad:#f2766e; --acc:#7aa2ff; --on-acc:#0d1b3d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, sans-serif;
         min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }
  main { width:100%; max-width:640px; flex:1; display:flex; flex-direction:column; gap:16px; }
  h1 { font-size:1.1rem; margin:0; }
  .muted { color:var(--muted); font-size:.9rem; }
  button { font:inherit; padding:12px 16px; border-radius:10px; border:1px solid var(--muted);
           background:var(--card); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--acc); border-color:var(--acc); color:var(--on-acc); }
  button.primary .muted { color:inherit; opacity:.75; }
  button.ok { border-color:var(--ok); color:var(--ok); }
  button.bad { border-color:var(--bad); color:var(--bad); }
  .drop { border:2px dashed var(--muted); border-radius:14px; padding:40px 16px; text-align:center; }
  .drop.over { border-color:var(--acc); }
  .bar { height:6px; background:var(--card); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; background:var(--acc); transition:width .2s; }
  .card { flex:1; min-height:220px; background:var(--card); border-radius:16px; padding:24px;
          display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center;
          font-size:1.4rem; cursor:pointer; user-select:none; box-shadow:0 1px 4px #0002; }
  .card .side { font-size:.75rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:12px; }
  .row { display:flex; gap:12px; } .row > * { flex:1; }
  .err { color:var(--bad); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">Flashcards</h1>
    <div class="muted" id="sub">M0 prototype: drop in a pack, flip, self-grade.</div>
  </header>

  <section id="load">
    <label class="drop" id="drop">
      <div>Drop a pack <code>.json</code> here, or tap to choose one</div>
      <input type="file" id="file" accept=".json,application/json" hidden>
    </label>
    <p class="muted">Or <a href="#" id="sample">try packs/sample.json</a> (needs a local server).</p>
    <p class="err" id="err"></p>
  </section>

  <section id="quiz" hidden style="display:contents">
    <div class="bar"><div id="prog"></div></div>
    <div class="card" id="card" tabindex="0"></div>
    <div class="row" id="flipRow"><button class="primary" id="flip">Show answer <span class="muted">(space)</span></button></div>
    <div class="row" id="gradeRow" hidden>
      <button class="bad" id="miss">Missed <span class="muted">(1 / ←)</span></button>
      <button class="ok" id="got">Got it <span class="muted">(2 / →)</span></button>
    </div>
  </section>

  <section id="done" hidden>
    <div class="card" style="cursor:default"><div id="score" style="font-size:2rem"></div><div class="muted" id="detail"></div></div>
    <div class="row" style="margin-top:16px">
      <button id="retry" class="primary">Retry missed</button>
      <button id="again">Restart all</button>
      <button id="newpack">New pack</button>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let pack, deck, i, missed, showingA;

function shuffle(a) {                       // Fisher-Yates, copy
  a = a.slice();
  for (let n = a.length - 1; n > 0; n--) { const j = Math.floor(Math.random() * (n + 1)); [a[n], a[j]] = [a[j], a[n]]; }
  return a;
}

function validate(p) {                      // minimal; real validation is M1
  if (!p || typeof p !== 'object') throw new Error('Pack must be a JSON object.');
  if (p.version !== 1) throw new Error('Unsupported pack version: ' + p.version);
  if (!Array.isArray(p.cards) || !p.cards.length) throw new Error('Pack has no cards.');
  const seen = new Set();
  p.cards.forEach((c, n) => {
    if (!c.id || !c.q || !c.a) throw new Error('Card #' + (n + 1) + ' needs id, q and a.');
    if (seen.has(c.id)) throw new Error('Duplicate card id: ' + c.id);
    seen.add(c.id);
  });
  return p;
}

function loadPack(text) {
  try { pack = validate(JSON.parse(text)); $('err').textContent = ''; }
  catch (e) { $('err').textContent = e.message; return; }
  $('title').textContent = pack.title || pack.id;
  $('sub').textContent = pack.cards.length + (pack.cards.length === 1 ? ' card' : ' cards') + (pack.description ? ' · ' + pack.description : '');
  start(pack.cards);
}

function show(which) {
  $('load').hidden = which !== 'load';
  $('quiz').hidden = which !== 'quiz';
  $('done').hidden = which !== 'done';
}

function start(cards) {
  deck = shuffle(cards); i = 0; missed = []; show('quiz'); render();
}

function render() {
  const c = deck[i]; showingA = false;
  $('prog').style.width = (i / deck.length * 100) + '%';
  $('card').innerHTML = '<div class="side">Question ' + (i + 1) + ' / ' + deck.length + '</div>';
  $('card').append(c.q);
  $('flipRow').hidden = false; $('gradeRow').hidden = true;
}

function flip() {
  if (showingA) return;
  const c = deck[i]; showingA = true;
  $('card').innerHTML = '<div class="side">Answer</div>';
  $('card').append(c.a);
  $('flipRow').hidden = true; $('gradeRow').hidden = false;
}

function grade(ok) {
  if (!showingA) return;
  if (!ok) missed.push(deck[i]);
  if (++i >= deck.length) return finish();
  render();
}

function finish() {
  $('prog').style.width = '100%';
  const right = deck.length - missed.length;
  $('score').textContent = right + ' / ' + deck.length;
  $('detail').textContent = missed.length ? 'Missed: ' + missed.map(c => c.q).join(' · ') : 'Perfect round.';
  $('retry').hidden = !missed.length;
  show('done');
}

$('card').onclick = flip; $('flip').onclick = flip;
$('got').onclick = () => grade(true); $('miss').onclick = () => grade(false);
$('retry').onclick = () => start(missed);
$('again').onclick = () => start(pack.cards);
$('newpack').onclick = () => { $('title').textContent = 'Flashcards'; $('sub').textContent = ''; show('load'); };

document.addEventListener('keydown', e => {
  if ($('quiz').hidden) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === '1' || e.key === 'ArrowLeft') grade(false);
  else if (e.key === '2' || e.key === 'ArrowRight') grade(true);
});

const readFile = f => f && f.text().then(loadPack);
$('file').onchange = e => readFile(e.target.files[0]);
$('drop').ondragover = e => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = e => { e.preventDefault(); $('drop').classList.remove('over'); readFile(e.dataTransfer.files[0]); };
$('sample').onclick = e => {
  e.preventDefault();
  fetch('../packs/sample.json').then(r => r.text()).then(loadPack)
    .catch(() => { $('err').textContent = 'Could not fetch the sample (open via a local server, or drop the file).'; });
};
</script>
</body>
</html>
